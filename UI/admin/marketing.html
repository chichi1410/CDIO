<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Banner & Voucher | Admin Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root { --primary: #9333ea; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: #f8fafc; color: #0f172a; min-height: 100vh; }

    header { background: #0f172a; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; color: white; }
    .container { max-width: 1100px; margin: 2.5rem auto; padding: 0 5%; }

    .card-box { background: white; border-radius: 28px; padding: 2rem; border: 1.5px solid #f1f5f9; box-shadow: 0 10px 25px rgba(0,0,0,0.03); margin-bottom: 2rem; }

    .form-group { margin-bottom: 1.25rem; }
    .form-input { width: 100%; padding: 0.8rem 1.2rem; border-radius: 14px; border: 1.5px solid #cbd5e1; outline: none; font-weight: 600; }
    .btn-create { padding: 0.8rem 1.8rem; border-radius: 9999px; background: #9333ea; color: white; border: none; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <a href="dashboard.html" style="font-weight: 800; text-decoration: none; color: white;"> Quay lại Admin Dashboard</a>
    <span style="font-weight: 800;">Quản Lý Marketing & Khuyến Mãi</span>
  </header>

  <div class="container">
    <div class="card-box">
      <h2 style="font-size: 1.3rem; font-weight: 800; margin-bottom: 1.5rem;">Tạo Mã Voucher Giảm Giá Mới</h2>

      <div class="form-group">
        <label style="display: block; font-weight: 700; margin-bottom: 0.5rem;">Mã khuyến mãi (Voucher Code)</label>
        <input type="text" value="CHAOMUNG2026" class="form-input">
      </div>

      <div class="form-group">
        <label style="display: block; font-weight: 700; margin-bottom: 0.5rem;">Số tiền giảm (VNĐ)</label>
        <input type="number" value="200000" class="form-input">
      </div>

      <button class="btn-create">TẠO MÃ GIẢM GIÁ</button>
    </div>
  </div>

</body>
</html>
