<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khôi phục mật khẩu | Language Learning Platform</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    :root {
      --primary-gradient: linear-gradient(120deg, #a855f7 0%, #ec4899 50%, #38bdf8 100%);
      --card-bg: rgba(255, 255, 255, 0.75);
      --card-border: rgba(255, 255, 255, 0.92);
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 15% 20%, #fff0f5 0%, #f3e7ff 38%, #e6f7ff 75%, #fff9f0 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    #fallingTextCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    .liquid-blob {
      position: fixed;
      filter: blur(55px);
      z-index: 0;
      opacity: 0.72;
      pointer-events: none;
    }

    .blob-rose {
      width: 460px;
      height: 460px;
      top: -8%;
      left: -6%;
      background: linear-gradient(135deg, #ffdde1 0%, #fcb69f 100%);
      animation: morphBlob1 16s ease-in-out infinite alternate;
    }

    .blob-lavender {
      width: 520px;
      height: 520px;
      bottom: -12%;
      right: -6%;
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      animation: morphBlob2 19s ease-in-out infinite alternate;
    }

    @keyframes morphBlob1 {
      0% { border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%; transform: scale(1); }
      100% { border-radius: 35% 65% 55% 45% / 62% 35% 65% 38%; transform: scale(1.08); }
    }

    @keyframes morphBlob2 {
      0% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; transform: scale(1); }
      100% { border-radius: 52% 48% 43% 57% / 66% 42% 58% 34%; transform: scale(1.06); }
    }

    .top-bar {
      position: absolute;
      top: 1.5rem;
      right: 2rem;
      z-index: 20;
    }

    .lang-switcher {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      padding: 7px 16px;
      border-radius: 9999px;
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 4px 15px rgba(148, 163, 184, 0.12);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .auth-wrapper {
      position: relative;
      width: 100%;
      max-width: 450px;
      z-index: 10;
    }

    .floating-badge {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      padding: 8px 16px;
      border-radius: 9999px;
      box-shadow: 0 10px 25px rgba(148, 118, 205, 0.15);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      font-size: 0.825rem;
      font-weight: 700;
      color: var(--text-main);
      z-index: 20;
      animation: floatBadgeNear 5s ease-in-out infinite alternate;
      pointer-events: none;
      white-space: nowrap;
    }

    .badge-near-1 { top: 30px; right: calc(100% + 40px); animation-delay: 0s; }
    .badge-near-2 { bottom: 50px; left: calc(100% + 40px); animation-delay: -2.5s; }

    @keyframes floatBadgeNear {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-10px) rotate(2deg); }
    }

    .aura-vessel {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1.5px solid var(--card-border);
      box-shadow:
        0 30px 70px -15px rgba(148, 118, 205, 0.18),
        0 12px 32px -8px rgba(255, 168, 198, 0.22),
        inset 0 2px 24px rgba(255, 255, 255, 0.95);
      border-radius: 46px 54px 44px 50px / 52px 46px 54px 46px;
      animation: vesselMorph 11s ease-in-out infinite alternate;
      padding: 2.5rem 2.25rem;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes vesselMorph {
      0% { border-radius: 46px 54px 44px 50px / 52px 46px 54px 46px; }
      50% { border-radius: 54px 44px 52px 42px / 44px 54px 46px 52px; }
      100% { border-radius: 42px 52px 48px 56px / 54px 46px 50px 42px; }
    }

    .brand-header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .brand-logo-orb {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 62px;
      height: 62px;
      border-radius: 46% 54% 62% 38% / 48% 58% 42% 52%;
      background: var(--primary-gradient);
      background-size: 200% 200%;
      animation: gradientFlow 6s ease infinite;
      color: #ffffff;
      font-size: 1.75rem;
      box-shadow: 0 12px 28px rgba(168, 85, 247, 0.35);
      margin-bottom: 0.75rem;
    }

    .brand-title {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #1e293b 0%, #6b21a8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .pill-input-wrap {
      position: relative;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.82);
      border: 1.5px solid rgba(226, 232, 240, 0.95);
      box-shadow: 0 4px 15px rgba(148, 163, 184, 0.06), inset 0 2px 6px rgba(255, 255, 255, 0.9);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      margin-bottom: 1.25rem;
    }

    .pill-input-wrap:focus-within {
      background: rgba(255, 255, 255, 0.98);
      border-color: #c084fc;
      box-shadow: 0 8px 25px -4px rgba(192, 132, 252, 0.28), 0 0 0 4px rgba(233, 213, 255, 0.45);
      transform: translateY(-2px);
    }

    .pill-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      padding: 0.9rem 3.2rem 0.9rem 3.25rem;
      font-size: 0.92rem;
      font-weight: 600;
      color: #1e293b;
      border-radius: 9999px;
    }

    .pill-label {
      position: absolute;
      left: 3.25rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.88rem;
      font-weight: 500;
      color: #94a3b8;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
      transform-origin: left center;
    }

    .pill-input:focus ~ .pill-label,
    .pill-input:not(:placeholder-shown) ~ .pill-label {
      opacity: 0;
      visibility: hidden;
      transform: translateY(-50%) scale(0.95);
    }

    .pill-icon {
      position: absolute;
      left: 1.25rem;
      top: 50%;
      transform: translateY(-50%);
      color: #a855f7;
      font-size: 1rem;
    }

    /* OTP Code Boxes */
    .otp-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 0.5rem;
      margin-left: 0.5rem;
    }

    .otp-container {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 1.25rem;
    }

    .otp-box {
      width: 46px;
      height: 52px;
      text-align: center;
      font-size: 1.25rem;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.85);
      border: 1.5px solid rgba(226, 232, 240, 0.95);
      border-radius: 16px;
      color: #1e293b;
      outline: none;
      transition: all 0.2s ease;
    }

    .otp-box:focus {
      background: #ffffff;
      border-color: #c084fc;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(192, 132, 252, 0.3);
    }

    .btn-aura {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 9999px;
      background: var(--primary-gradient);
      background-size: 200% 200%;
      animation: gradientFlow 6s ease infinite;
      color: #ffffff;
      font-size: 0.975rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      box-shadow: 0 14px 30px -6px rgba(236, 72, 153, 0.42);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      margin-top: 0.5rem;
    }

    .btn-aura:hover {
      transform: translateY(-3px) scale(1.015);
      box-shadow: 0 20px 38px -8px rgba(168, 85, 247, 0.55);
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .auth-footer a {
      color: #9333ea;
      font-weight: 800;
      text-decoration: none;
    }

    .auth-footer a:hover { text-decoration: underline; }

    .toast-demo {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      border: 1.5px solid #ffffff;
      color: #1e293b;
      padding: 12px 24px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.875rem;
      box-shadow: 0 14px 30px rgba(148, 118, 205, 0.25);
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
    }

    .toast-demo.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 992px) {
      .floating-badge { display: none; }
      .aura-vessel { padding: 2rem 1.5rem; }
      .badge-near-1, .badge-near-2 { display: none; }
    }
  </style>
</head>
<body>
  <div class="liquid-blob blob-rose"></div>
  <div class="liquid-blob blob-lavender"></div>

  <canvas id="fallingTextCanvas"></canvas>

  <div class="top-bar">
    <div class="lang-switcher">
      <span>🇻🇳 Tiếng Việt</span>
      <i class="fa-solid fa-chevron-down" style="font-size: 0.75rem; color: #94a3b8;"></i>
    </div>
  </div>

  <div class="auth-wrapper">
    <div class="floating-badge badge-near-1">
      <span>🔐</span>
      <span>Bảo mật khôi phục</span>
    </div>
    <div class="floating-badge badge-near-2">
      <span>⚡</span>
      <span>Xác minh OTP</span>
    </div>

    <div class="aura-vessel" id="auraVessel">
      <div class="brand-header">
        <div class="brand-logo-orb">
          <i class="fa-solid fa-key"></i>
        </div>
        <h1 class="brand-title">Language Learning</h1>
        <p class="brand-subtitle">Khôi phục mật khẩu tài khoản</p>
      </div>

      <form action="#" method="POST" id="forgotForm">
        <div class="pill-input-wrap">
          <i class="fa-regular fa-envelope pill-icon"></i>
          <input type="email" id="email" required placeholder=" " class="pill-input">
          <label for="email" class="pill-label">Địa chỉ Email đã đăng ký</label>
        </div>

        <div>
          <label class="otp-label">Nhập mã OTP 6 chữ số</label>
          <div class="otp-container">
            <input type="text" maxlength="1" class="otp-box" />
            <input type="text" maxlength="1" class="otp-box" />
            <input type="text" maxlength="1" class="otp-box" />
            <input type="text" maxlength="1" class="otp-box" />
            <input type="text" maxlength="1" class="otp-box" />
            <input type="text" maxlength="1" class="otp-box" />
          </div>
        </div>

        <div class="pill-input-wrap">
          <i class="fa-solid fa-lock pill-icon"></i>
          <input type="password" id="new-password" required placeholder=" " class="pill-input">
          <label for="new-password" class="pill-label">Mật khẩu mới</label>
        </div>

        <button type="submit" class="btn-aura">
          <span>ĐẶT LẠI MẬT KHẨU</span>
          <i class="fa-solid fa-check text-xs"></i>
        </button>
      </form>

      <div class="auth-footer">
        Nhớ ra mật khẩu? <a href="login.html">Đăng nhập ngay</a>
      </div>
    </div>
  </div>

  <div class="toast-demo" id="toastDemo">
    <i class="fa-solid fa-sparkles text-purple-600"></i>
    <span>Mật khẩu đã được đặt lại thành công!</span>
  </div>

  <script>
    // Falling Text Streams
    const canvas = document.getElementById('fallingTextCanvas');
    const ctx = canvas.getContext('2d');
    const PHRASES = ['日本語', 'こんにちは', 'hello', 'xin chao'];
    const PALETTE = ['#a855f7', '#ec4899', '#0ea5e9', '#8b5cf6'];

    let streams = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initStreams();
    }

    function initStreams() {
      streams = [];
      const count = Math.floor(canvas.width / 50);
      for (let i = 0; i < count; i++) {
        streams.push({
          x: i * 50 + Math.random() * 20,
          y: Math.random() * canvas.height,
          speedY: 1 + Math.random() * 1.5,
          fontSize: 13 + Math.floor(Math.random() * 4),
          phrase: PHRASES[Math.floor(Math.random() * PHRASES.length)],
          color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
          alpha: 0.25 + Math.random() * 0.45
        });
      }
    }

    function drawStreams() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let s of streams) {
        s.y += s.speedY;
        if (s.y > canvas.height + 40) {
          s.y = -30;
          s.x = Math.random() * canvas.width;
        }
        ctx.save();
        ctx.font = `600 ${s.fontSize}px 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif`;
        ctx.fillStyle = s.color;
        ctx.globalAlpha = s.alpha;
        ctx.fillText(s.phrase, s.x, s.y);
        ctx.restore();
      }
      requestAnimationFrame(drawStreams);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    drawStreams();

    // 3D Organic Tilt
    const vessel = document.getElementById('auraVessel');
    window.addEventListener('mousemove', (e) => {
      const rect = vessel.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const rotateY = ((e.clientX - centerX) / (window.innerWidth / 2)) * 4;
      const rotateX = -((e.clientY - centerY) / (window.innerHeight / 2)) * 4;
      vessel.style.transform = `perspective(1000px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg)`;
    });

    window.addEventListener('mouseleave', () => {
      vessel.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
    });

    // OTP Auto Focus
    const otpBoxes = document.querySelectorAll('.otp-box');
    otpBoxes.forEach((box, index) => {
      box.addEventListener('input', (e) => {
        if (box.value.length === 1 && index < otpBoxes.length - 1) {
          otpBoxes[index + 1].focus();
        }
      });
      box.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !box.value && index > 0) {
          otpBoxes[index - 1].focus();
        }
      });
    });

    document.getElementById('forgotForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const toast = document.getElementById('toastDemo');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    });
  </script>
</body>
</html>
