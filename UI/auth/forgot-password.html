<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu | E-Learning LMS SaaS</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #030712;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    .glow-1 {
      position: absolute;
      top: 20%;
      left: 20%;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(79, 70, 229, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
      filter: blur(80px);
      pointer-events: none;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 10;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: #ffffff;
      font-size: 1.4rem;
      box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
      margin-bottom: 0.75rem;
    }

    .brand-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #ffffff;
    }

    .auth-card {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 2.25rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .card-desc {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 1.5rem;
      text-align: center;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #d1d5db;
      margin-bottom: 0.4rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      color: #6b7280;
      font-size: 0.95rem;
    }

    .form-input {
      width: 100%;
      height: 48px;
      background: rgba(31, 41, 55, 0.6);
      border: 1px solid rgba(75, 85, 99, 0.4);
      border-radius: 12px;
      padding: 0 1rem 0 2.75rem;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: #6366f1;
      background: rgba(31, 41, 55, 0.9);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    /* OTP Code Inputs */
    .otp-container {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 1.25rem;
    }

    .otp-box {
      width: 46px;
      height: 52px;
      text-align: center;
      font-size: 1.25rem;
      font-weight: 700;
      background: rgba(31, 41, 55, 0.7);
      border: 1px solid rgba(75, 85, 99, 0.5);
      border-radius: 12px;
      color: #ffffff;
      outline: none;
      transition: all 0.2s;
    }

    .otp-box:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
    }

    .btn-submit {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
      transition: all 0.2s ease;
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: #9ca3af;
    }

    .auth-footer a {
      color: #818cf8;
      font-weight: 600;
      text-decoration: none;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="glow-1"></div>

  <div class="auth-container">
    <div class="brand-header">
      <div class="brand-logo">
        <i class="fa-solid fa-key"></i>
      </div>
      <h1 class="brand-title">E-Learning LMS SaaS</h1>
    </div>

    <div class="auth-card">
      <h2 class="card-title">Quên mật khẩu</h2>
      <p class="card-desc">Nhập Email để nhận mã OTP khôi phục mật khẩu tài khoản của bạn</p>

      <form action="#" method="POST" onsubmit="event.preventDefault();">
        <div class="form-group">
          <label class="form-label" for="email">Địa chỉ Email đã đăng ký</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input type="email" id="email" class="form-input" placeholder="user@example.com" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Nhập mã OTP 6 chữ số (Gửi tới Email)</label>
          <div class="otp-container">
            <input type="text" maxlength="1" class="otp-box" />
            <input type="text" maxlength="1" class="otp-box" />
            <input type="text" maxlength="1" class="otp-box" />
            <input type="text" maxlength="1" class="otp-box" />
            <input type="text" maxlength="1" class="otp-box" />
            <input type="text" maxlength="1" class="otp-box" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="new-password">Mật khẩu mới</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="new-password" class="form-input" placeholder="••••••••" required />
          </div>
        </div>

        <button type="submit" class="btn-submit">
          <span>Đặt lại mật khẩu</span>
          <i class="fa-solid fa-check"></i>
        </button>
      </form>

      <div class="auth-footer">
        Quay lại <a href="login.html">Đăng nhập</a>
      </div>
    </div>
  </div>
</body>
</html>
