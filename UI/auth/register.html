<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký tài khoản | E-Learning LMS SaaS</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #030712;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    .glow-1 {
      position: absolute;
      top: 10%;
      right: 25%;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(79, 70, 229, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
      filter: blur(80px);
      pointer-events: none;
    }

    .glow-2 {
      position: absolute;
      bottom: 5%;
      left: 20%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(147, 51, 234, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
      filter: blur(80px);
      pointer-events: none;
    }

    .auth-container {
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 10;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: #ffffff;
      font-size: 1.4rem;
      box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
      margin-bottom: 0.75rem;
    }

    .brand-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.025em;
    }

    .auth-card {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.25rem;
      text-align: center;
    }

    .card-desc {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 1.25rem;
      text-align: center;
    }

    /* Segmented Control for Role Selection */
    .role-selector {
      display: flex;
      background: rgba(31, 41, 55, 0.8);
      border: 1px solid rgba(75, 85, 99, 0.4);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 1.25rem;
      gap: 4px;
    }

    .role-option {
      flex: 1;
      text-align: center;
    }

    .role-option input {
      display: none;
    }

    .role-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.6rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #9ca3af;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .role-option input:checked + .role-label {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #d1d5db;
      margin-bottom: 0.4rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      color: #6b7280;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .form-input {
      width: 100%;
      height: 44px;
      background: rgba(31, 41, 55, 0.6);
      border: 1px solid rgba(75, 85, 99, 0.4);
      border-radius: 12px;
      padding: 0 1rem 0 2.75rem;
      color: #ffffff;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: #6366f1;
      background: rgba(31, 41, 55, 0.9);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    .form-input:focus + .input-icon,
    .input-wrapper:focus-within .input-icon {
      color: #818cf8;
    }

    .btn-submit {
      width: 100%;
      height: 46px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
      transition: all 0.2s ease;
      margin-top: 1.25rem;
    }

    .btn-submit:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .auth-footer {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.85rem;
      color: #9ca3af;
    }

    .auth-footer a {
      color: #818cf8;
      font-weight: 600;
      text-decoration: none;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="auth-container">
    <div class="brand-header">
      <div class="brand-logo">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <h1 class="brand-title">E-Learning LMS SaaS</h1>
    </div>

    <div class="auth-card">
      <h2 class="card-title">Tạo tài khoản mới</h2>
      <p class="card-desc">Tham gia hệ thống học tập & giảng dạy trực tuyến</p>

      <form action="#" method="POST" onsubmit="event.preventDefault();">
        <!-- Role Switcher -->
        <label class="form-label">Bạn đăng ký với vai trò gì?</label>
        <div class="role-selector">
          <div class="role-option">
            <input type="radio" id="role-student" name="role" value="ROLE_USER" checked />
            <label for="role-student" class="role-label">
              <i class="fa-solid fa-user-graduate"></i> Học viên
            </label>
          </div>
          <div class="role-option">
            <input type="radio" id="role-instructor" name="role" value="ROLE_INSTRUCTOR" />
            <label for="role-instructor" class="role-label">
              <i class="fa-solid fa-chalkboard-user"></i> Giảng viên
            </label>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="fullname">Họ và tên</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-user input-icon"></i>
            <input type="text" id="fullname" class="form-input" placeholder="Nguyễn Văn A" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Địa chỉ Email</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input type="email" id="email" class="form-input" placeholder="user@example.com" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Mật khẩu</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="password" class="form-input" placeholder="••••••••" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Xác nhận mật khẩu</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="confirm-password" class="form-input" placeholder="••••••••" required />
          </div>
        </div>

        <button type="submit" class="btn-submit">
          <span>Tạo tài khoản</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="auth-footer">
        Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
      </div>
    </div>
  </div>
</body>
</html>
