<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | E-Learning LMS SaaS</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #030712;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Background Glows */
    .glow-1 {
      position: absolute;
      top: 15%;
      left: 30%;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(79, 70, 229, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
      filter: blur(80px);
      pointer-events: none;
    }

    .glow-2 {
      position: absolute;
      bottom: 10%;
      right: 25%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(147, 51, 234, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
      filter: blur(80px);
      pointer-events: none;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 10;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: #ffffff;
      font-size: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
      margin-bottom: 1rem;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.025em;
    }

    .brand-subtitle {
      font-size: 0.875rem;
      color: #9ca3af;
      margin-top: 0.25rem;
    }

    .auth-card {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 2.25rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }

    .card-desc {
      font-size: 0.875rem;
      color: #9ca3af;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #d1d5db;
      margin-bottom: 0.5rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      color: #6b7280;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .form-input {
      width: 100%;
      height: 48px;
      background: rgba(31, 41, 55, 0.6);
      border: 1px solid rgba(75, 85, 99, 0.4);
      border-radius: 12px;
      padding: 0 1rem 0 2.75rem;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: #6366f1;
      background: rgba(31, 41, 55, 0.9);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    .form-input:focus + .input-icon,
    .input-wrapper:focus-within .input-icon {
      color: #818cf8;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #9ca3af;
      cursor: pointer;
    }

    .remember-me input {
      accent-color: #6366f1;
      width: 16px;
      height: 16px;
      border-radius: 4px;
      cursor: pointer;
    }

    .forgot-link {
      color: #818cf8;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .forgot-link:hover {
      color: #a5b4fc;
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
      box-shadow: 0 12px 24px -5px rgba(79, 70, 229, 0.5);
    }

    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: #9ca3af;
    }

    .auth-footer a {
      color: #818cf8;
      font-weight: 600;
      text-decoration: none;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="auth-container">
    <!-- Brand Header -->
    <div class="brand-header">
      <div class="brand-logo">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <h1 class="brand-title">E-Learning LMS SaaS</h1>
      <p class="brand-subtitle">Nền tảng Học trực tuyến & Bán khóa học</p>
    </div>

    <!-- Auth Card -->
    <div class="auth-card">
      <h2 class="card-title">Đăng nhập tài khoản</h2>
      <p class="card-desc">Nhập Email và Mật khẩu của bạn để truy cập hệ thống</p>

      <form action="#" method="POST" onsubmit="event.preventDefault();">
        <div class="form-group">
          <label class="form-label" for="email">Địa chỉ Email</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input type="email" id="email" class="form-input" placeholder="hocvien@saas.com" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Mật khẩu</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="password" class="form-input" placeholder="••••••••" required />
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="remember" />
            <span>Ghi nhớ đăng nhập</span>
          </label>
          <a href="forgot-password.html" class="forgot-link">Quên mật khẩu?</a>
        </div>

        <button type="submit" class="btn-submit">
          <span>Đăng nhập</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="auth-footer">
        Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
      </div>
    </div>
  </div>
</body>
</html>
