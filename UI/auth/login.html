<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | Language Learning Platform</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    :root {
      --primary-gradient: linear-gradient(120deg, #a855f7 0%, #ec4899 50%, #38bdf8 100%);
      --card-bg: rgba(255, 255, 255, 0.75);
      --card-border: rgba(255, 255, 255, 0.92);
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 15% 20%, #fff0f5 0%, #f3e7ff 38%, #e6f7ff 75%, #fff9f0 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Canvas for Falling Text Streams */
    #fallingTextCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Morphing Liquid Pastel Blobs */
    .liquid-blob {
      position: fixed;
      filter: blur(55px);
      z-index: 0;
      opacity: 0.72;
      pointer-events: none;
      will-change: border-radius, transform;
    }

    .blob-rose {
      width: 460px;
      height: 460px;
      top: -8%;
      left: -6%;
      background: linear-gradient(135deg, #ffdde1 0%, #fcb69f 100%);
      animation: morphBlob1 16s ease-in-out infinite alternate;
    }

    .blob-lavender {
      width: 520px;
      height: 520px;
      bottom: -12%;
      right: -6%;
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      animation: morphBlob2 19s ease-in-out infinite alternate;
    }

    .blob-mint {
      width: 380px;
      height: 380px;
      top: 28%;
      left: 58%;
      background: linear-gradient(135deg, #c2e9fb 0%, #ffecd2 100%);
      animation: morphBlob3 14s ease-in-out infinite alternate;
    }

    @keyframes morphBlob1 {
      0% { border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%; transform: translate(0, 0) scale(1); }
      50% { border-radius: 68% 32% 42% 58% / 58% 64% 36% 42%; transform: translate(40px, 30px) scale(1.08); }
      100% { border-radius: 35% 65% 55% 45% / 62% 35% 65% 38%; transform: translate(-20px, 50px) scale(0.95); }
    }

    @keyframes morphBlob2 {
      0% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; transform: translate(0, 0) scale(1); }
      50% { border-radius: 35% 65% 65% 35% / 40% 55% 45% 60%; transform: translate(-45px, -35px) scale(1.06); }
      100% { border-radius: 52% 48% 43% 57% / 66% 42% 58% 34%; transform: translate(25px, -15px) scale(0.96); }
    }

    @keyframes morphBlob3 {
      0% { border-radius: 50% 50% 35% 65% / 55% 40% 60% 45%; transform: translate(0, 0) scale(1); }
      100% { border-radius: 65% 35% 62% 38% / 42% 62% 38% 58%; transform: translate(-50px, 35px) scale(1.12); }
    }

    /* Top Language Bar */
    .top-bar {
      position: absolute;
      top: 1.5rem;
      right: 2rem;
      z-index: 20;
    }

    .lang-switcher {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      padding: 7px 16px;
      border-radius: 9999px;
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 4px 15px rgba(148, 163, 184, 0.12);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      transition: all 0.25s ease;
    }

    .lang-switcher:hover {
      background: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(168, 85, 247, 0.2);
    }

    /* Auth Wrapper & Floating Badges close to card */
    .auth-wrapper {
      position: relative;
      width: 100%;
      max-width: 450px;
      z-index: 10;
    }

    /* Floating Badges Positioned CLOSE to Card */
    .floating-badge {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      padding: 8px 16px;
      border-radius: 9999px;
      box-shadow: 0 10px 25px rgba(148, 118, 205, 0.15);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      font-size: 0.825rem;
      font-weight: 700;
      color: var(--text-main);
      z-index: 20;
      animation: floatBadgeNear 5s ease-in-out infinite alternate;
      pointer-events: none;
      white-space: nowrap;
    }

    .badge-near-1 {
      top: 30px;
      right: calc(100% + 40px);
      animation-delay: 0s;
    }

    .badge-near-2 {
      bottom: 50px;
      left: calc(100% + 40px);
      animation-delay: -2.5s;
    }

    @keyframes floatBadgeNear {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-10px) rotate(2deg); }
    }

    /* Aura Organic Glass Vessel (No sharp boxy corners) */
    .aura-vessel {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1.5px solid var(--card-border);
      box-shadow:
        0 30px 70px -15px rgba(148, 118, 205, 0.18),
        0 12px 32px -8px rgba(255, 168, 198, 0.22),
        inset 0 2px 24px rgba(255, 255, 255, 0.95);
      border-radius: 46px 54px 44px 50px / 52px 46px 54px 46px;
      animation: vesselMorph 11s ease-in-out infinite alternate;
      padding: 2.5rem 2.25rem;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes vesselMorph {
      0% { border-radius: 46px 54px 44px 50px / 52px 46px 54px 46px; }
      50% { border-radius: 54px 44px 52px 42px / 44px 54px 46px 52px; }
      100% { border-radius: 42px 52px 48px 56px / 54px 46px 50px 42px; }
    }

    .brand-header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .brand-logo-orb {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 62px;
      height: 62px;
      border-radius: 46% 54% 62% 38% / 48% 58% 42% 52%;
      background: var(--primary-gradient);
      background-size: 200% 200%;
      animation: gradientFlow 6s ease infinite;
      color: #ffffff;
      font-size: 1.75rem;
      box-shadow: 0 12px 28px rgba(168, 85, 247, 0.35);
      margin-bottom: 0.75rem;
    }

    .brand-title {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #1e293b 0%, #6b21a8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
      font-weight: 500;
    }

    /* Aura Floating Pill Input Wrappers */
    .pill-input-wrap {
      position: relative;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.82);
      border: 1.5px solid rgba(226, 232, 240, 0.95);
      box-shadow: 0 4px 15px rgba(148, 163, 184, 0.06), inset 0 2px 6px rgba(255, 255, 255, 0.9);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      margin-bottom: 1.25rem;
    }

    .pill-input-wrap:focus-within {
      background: rgba(255, 255, 255, 0.98);
      border-color: #c084fc;
      box-shadow: 0 8px 25px -4px rgba(192, 132, 252, 0.28), 0 0 0 4px rgba(233, 213, 255, 0.45);
      transform: translateY(-2px);
    }

    .pill-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      padding: 0.9rem 3.2rem 0.9rem 3.25rem;
      font-size: 0.92rem;
      font-weight: 600;
      color: #1e293b;
      border-radius: 9999px;
    }

    .pill-label {
      position: absolute;
      left: 3.25rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.88rem;
      font-weight: 500;
      color: #94a3b8;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
      transform-origin: left center;
    }

    .pill-input:focus ~ .pill-label,
    .pill-input:not(:placeholder-shown) ~ .pill-label {
      opacity: 0;
      visibility: hidden;
      transform: translateY(-50%) scale(0.95);
    }

    .pill-icon {
      position: absolute;
      left: 1.25rem;
      top: 50%;
      transform: translateY(-50%);
      color: #a855f7;
      font-size: 1rem;
      transition: transform 0.3s ease, color 0.3s ease;
    }

    .pill-input-wrap:focus-within .pill-icon {
      transform: translateY(-50%) scale(1.15) rotate(-6deg);
      color: #ec4899;
    }

    .toggle-password {
      position: absolute;
      right: 1.1rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.95rem;
      cursor: pointer;
      padding: 4px;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: #9333ea;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding: 0 0.5rem;
      font-size: 0.85rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #475569;
      font-weight: 600;
      cursor: pointer;
    }

    .remember-me input {
      accent-color: #9333ea;
      width: 16px;
      height: 16px;
      border-radius: 4px;
      cursor: pointer;
    }

    .forgot-link {
      color: #9333ea;
      text-decoration: none;
      font-weight: 700;
      transition: color 0.2s;
    }

    .forgot-link:hover {
      color: #ec4899;
      text-decoration: underline;
    }

    /* Aura Flowing Pastel Button */
    .btn-aura {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 9999px;
      background: var(--primary-gradient);
      background-size: 200% 200%;
      animation: gradientFlow 6s ease infinite;
      color: #ffffff;
      font-size: 0.975rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      box-shadow: 0 14px 30px -6px rgba(236, 72, 153, 0.42);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }

    .btn-aura:hover {
      transform: translateY(-3px) scale(1.015);
      box-shadow: 0 20px 38px -8px rgba(168, 85, 247, 0.55);
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Social Login Orbs */
    .social-group {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .social-orb {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.85);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 6px 18px rgba(148, 163, 184, 0.12);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .social-orb:hover {
      transform: translateY(-3px) scale(1.04);
      background: #ffffff;
      box-shadow: 0 12px 24px rgba(168, 85, 247, 0.2);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin-top: 1.5rem;
      color: #94a3b8;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
    }

    .divider span { padding: 0 0.75rem; }

    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .auth-footer a {
      color: #9333ea;
      font-weight: 800;
      text-decoration: none;
    }

    .auth-footer a:hover { text-decoration: underline; }

    /* Toast Notification */
    .toast-demo {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      border: 1.5px solid #ffffff;
      color: #1e293b;
      padding: 12px 24px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.875rem;
      box-shadow: 0 14px 30px rgba(148, 118, 205, 0.25);
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
    }

    .toast-demo.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 992px) {
      .floating-badge { display: none; }
      .aura-vessel { padding: 2rem 1.5rem; }
      .badge-near-1, .badge-near-2 { display: none; }
    }
  </style>
</head>
<body>
  <!-- 1. Morphing Liquid Pastel Blobs -->
  <div class="liquid-blob blob-rose"></div>
  <div class="liquid-blob blob-lavender"></div>
  <div class="liquid-blob blob-mint"></div>

  <!-- 2. Fullscreen Falling Text Canvas -->
  <canvas id="fallingTextCanvas"></canvas>

  <!-- Top Language Switcher -->
  <div class="top-bar">
    <div class="lang-switcher">
      <span>🇻🇳 Tiếng Việt</span>
      <i class="fa-solid fa-chevron-down" style="font-size: 0.75rem; color: #94a3b8;"></i>
    </div>
  </div>

  <div class="auth-wrapper">
    <!-- Floating Badges Positioned CLOSE to Card -->
    <div class="floating-badge badge-near-1">
      <span>🇬🇧</span>
      <span>Hello • Welcome!</span>
    </div>
    <div class="floating-badge badge-near-2">
      <span>🇯🇵</span>
      <span>こんにちは • Nihongo</span>
    </div>

    <!-- Organic Glass Vessel Card -->
    <div class="aura-vessel" id="auraVessel">
      <div class="brand-header">
        <div class="brand-logo-orb">
          <i class="fa-solid fa-language"></i>
        </div>
        <h1 class="brand-title">Language Learning</h1>
        <p class="brand-subtitle">Học ngoại ngữ tự nhiên cùng nhịp sống Aura</p>
      </div>

      <form action="#" method="POST" id="loginForm">
        <div class="pill-input-wrap">
          <i class="fa-regular fa-envelope pill-icon"></i>
          <input type="email" id="loginEmail" required placeholder=" " class="pill-input">
          <label for="loginEmail" class="pill-label">Địa chỉ Email</label>
        </div>

        <div class="pill-input-wrap">
          <i class="fa-solid fa-lock pill-icon"></i>
          <input type="password" id="loginPassword" required placeholder=" " class="pill-input">
          <label for="loginPassword" class="pill-label">Mật khẩu</label>
          <button type="button" class="toggle-password" id="togglePasswordBtn">
            <i class="fa-regular fa-eye" id="passwordIcon"></i>
          </button>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="remember" checked />
            <span>Ghi nhớ đăng nhập</span>
          </label>
          <a href="forgot-password.html" class="forgot-link">Quên mật khẩu?</a>
        </div>

        <button type="submit" class="btn-aura">
          <span>ĐĂNG NHẬP NGAY</span>
          <i class="fa-solid fa-arrow-right-long text-xs"></i>
        </button>
      </form>

      <div class="divider">
        <span>Hoặc đăng nhập nhanh</span>
      </div>

      <div class="social-group">
        <button type="button" class="social-orb" onclick="showToast('Đang kết nối tài khoản Google...')">
          <i class="fa-brands fa-google text-rose-500"></i>
          <span>Google</span>
        </button>
        <button type="button" class="social-orb" onclick="showToast('Đang kết nối tài khoản Apple...')">
          <i class="fa-brands fa-apple text-slate-800"></i>
          <span>Apple</span>
        </button>
      </div>

      <div class="auth-footer">
        Chưa có tài khoản? <a href="register.html">Đăng ký trải nghiệm ngay</a>
      </div>
    </div>
  </div>

  <!-- Toast Demo -->
  <div class="toast-demo" id="toastDemo">
    <i class="fa-solid fa-sparkles text-purple-600"></i>
    <span id="toastText">Đăng nhập thành công!</span>
  </div>

  <script>
    // Falling Text Streams Canvas Logic
    const canvas = document.getElementById('fallingTextCanvas');
    const ctx = canvas.getContext('2d');

    const PHRASES = ['日本語', 'こんにちは', 'hello', 'xin chao'];
    const PALETTE = ['#a855f7', '#ec4899', '#0ea5e9', '#8b5cf6', '#14b8a6'];

    let streams = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initStreams();
    }

    function initStreams() {
      streams = [];
      const count = Math.floor(canvas.width / 45);
      for (let i = 0; i < count; i++) {
        const phrase = PHRASES[Math.floor(Math.random() * PHRASES.length)];
        streams.push({
          x: i * 45 + Math.random() * 20,
          y: Math.random() * canvas.height,
          speedY: 1 + Math.random() * 1.5,
          fontSize: 13 + Math.floor(Math.random() * 4),
          phrase: phrase,
          color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
          alpha: 0.25 + Math.random() * 0.45
        });
      }
    }

    function drawStreams() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let s of streams) {
        s.y += s.speedY;
        if (s.y > canvas.height + 40) {
          s.y = -30;
          s.x = Math.random() * canvas.width;
        }

        ctx.save();
        ctx.font = `600 ${s.fontSize}px 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif`;
        ctx.fillStyle = s.color;
        ctx.globalAlpha = s.alpha;
        ctx.fillText(s.phrase, s.x, s.y);
        ctx.restore();
      }
      requestAnimationFrame(drawStreams);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    drawStreams();

    // 3D Glass Vessel Organic Tilt
    const vessel = document.getElementById('auraVessel');
    window.addEventListener('mousemove', (e) => {
      const rect = vessel.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const rotateY = ((e.clientX - centerX) / (window.innerWidth / 2)) * 4;
      const rotateX = -((e.clientY - centerY) / (window.innerHeight / 2)) * 4;
      vessel.style.transform = `perspective(1000px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg)`;
    });

    window.addEventListener('mouseleave', () => {
      vessel.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
    });

    // Password Visibility Toggle
    const passwordInput = document.getElementById('loginPassword');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const passwordIcon = document.getElementById('passwordIcon');

    toggleBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      passwordIcon.className = type === 'password' ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
    });

    // Form Submit Feedback & Redirect to Home
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value || 'nguyenvana@gmail.com';
      localStorage.setItem('isLoggedIn', 'true');
      localStorage.setItem('user', JSON.stringify({
        name: 'Nguyen Van A',
        email: email,
        role: 'ROLE_USER',
        avatar: 'NV'
      }));

      showToast('Đăng nhập thành công! Đang chuyển hướng...');
      setTimeout(() => {
        window.location.href = '../index.html';
      }, 1200);
    });

    function showToast(msg) {
      const toast = document.getElementById('toastDemo');
      document.getElementById('toastText').textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
