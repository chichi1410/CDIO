<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanh Toán Thành Công | Language Learning Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root { var-primary: #9333ea; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }

    .success-card {
      background: white; border-radius: 36px; padding: 3rem; text-align: center; max-width: 550px;
      box-shadow: 0 25px 60px rgba(147, 51, 234, 0.15); border: 1.5px solid #f1f5f9;
    }

    .check-icon-wrap {
      width: 80px; height: 80px; border-radius: 50%; background: #dcfce7; color: #16a34a;
      font-size: 2.5rem; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;
    }

    .title { font-size: 1.8rem; font-weight: 800; color: #0f172a; margin-bottom: 0.5rem; }
    .subtitle { color: #64748b; font-size: 0.95rem; margin-bottom: 2rem; line-height: 1.6; }

    .btn-go-learn {
      display: inline-block; padding: 1rem 2.2rem; border-radius: 9999px; border: none;
      background: linear-gradient(135deg, #9333ea, #ec4899); color: white;
      font-weight: 800; text-decoration: none; font-size: 1rem;
      box-shadow: 0 10px 25px rgba(147, 51, 234, 0.3);
    }
  </style>
</head>
<body>

  <div class="success-card">
    <div class="check-icon-wrap"><i class="fa-solid fa-check"></i></div>
    <h1 class="title">Thanh Toán Thành Công!</h1>
    <p class="subtitle">Cảm ơn bạn đã đăng ký khóa học tại <strong>Language Learning</strong>. Hóa đơn điện tử đã được gửi tới email của bạn. Khóa học đã được tự động kích hoạt!</p>
    <a href="dashboard.html" class="btn-go-learn"><i class="fa-solid fa-graduation-cap"></i> Vào Học Ngay Trực Tiếp</a>
  </div>

</body>
</html>
