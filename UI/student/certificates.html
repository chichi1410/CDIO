<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chứng Chỉ Của Tôi | Language Learning Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root { --primary: #9333ea; --accent-pink: #ec4899; --bg-light: #f8fafc; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-light); color: #0f172a; min-height: 100vh; }

    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px);
      border-bottom: 1.5px solid rgba(255, 255, 255, 0.9);
      padding: 1rem 5%; display: flex; align-items: center; justify-content: space-between;
    }
    .brand-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .brand-icon { width: 42px; height: 42px; background: linear-gradient(135deg, var(--primary), var(--accent-pink)); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.25rem; }
    .brand-title { font-size: 1.35rem; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--accent-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .container { max-width: 1100px; margin: 3rem auto; padding: 0 5%; }

    .cert-card {
      background: white; border-radius: 28px; padding: 2rem; border: 1.5px solid #f1f5f9;
      box-shadow: 0 10px 25px rgba(0,0,0,0.03); display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem;
    }

    .cert-info-h3 { font-size: 1.2rem; font-weight: 800; margin-bottom: 0.25rem; }
    .cert-code { font-size: 0.85rem; color: #64748b; font-weight: 600; }

    .btn-download {
      padding: 0.75rem 1.5rem; border-radius: 9999px; border: none;
      background: linear-gradient(135deg, var(--primary), var(--accent-pink));
      color: white; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
    }
  </style>
</head>
<body>

  <header>
    <a href="../index.html" class="brand-logo">
      <div class="brand-icon"><i class="fa-solid fa-language"></i></div>
      <span class="brand-title">Language Learning</span>
    </a>
    <a href="dashboard.html" style="text-decoration: none; font-weight: 700; color: var(--primary);"> Quay lại Dashboard</a>
  </header>

  <div class="container">
    <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 2rem;">Chứng Chỉ Đã Nhận (1)</h1>

    <div class="cert-card">
      <div>
        <h3 class="cert-info-h3">🇬🇧 Chứng Chỉ Tiếng Anh Giao Tiếp Siêu Phản Xạ</h3>
        <p class="cert-code">Mã chứng chỉ: CERT-2026-ENG-89410 • Ngày cấp: 15/09/2026</p>
      </div>
      <a href="#" class="btn-download"><i class="fa-solid fa-file-pdf"></i> Tải File PDF</a>
    </div>
  </div>

</body>
</html>
