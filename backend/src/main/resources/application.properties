spring.application.name=saas_app

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/saas_new_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# JWT RSA Key Configuration
jwt.private-key=classpath:certs/private.pem
jwt.public-key=classpath:certs/public.pem

# Server Binding
server.address=0.0.0.0

# Security & CORS
AUTH_ALLOWED_ORIGINS=http://localhost:3000,http://26.187.137.70:3000,http://26.187.137.70:8080,http://26.187.137.70
AUTH_COOKIE_SECURE=false
AUTH_JWT_ISSUER=saas-app

# File Upload Limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
