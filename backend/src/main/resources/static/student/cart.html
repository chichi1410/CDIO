<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ Hàng | LHD – Learning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --primary-grad: linear-gradient(135deg, #0b63e5 0%, #8b5cf6 55%, #ec4899 100%);
      --primary-color: #0b63e5;
      --purple-color: #8b5cf6;
      --pink-color: #ec4899;
      --bg-page: #f8fafc;
      --text-main: #0f172a;
      --text-sub: #475569;
      --card-bg: rgba(255, 255, 255, 0.95);
      --border-subtle: rgba(226, 232, 240, 0.85);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient background glows */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.35;
    }

    .bg-orb-1 {
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, #38bdf8 0%, #818cf8 100%);
      top: -120px;
      right: -100px;
    }

    .bg-orb-2 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, #f472b6 0%, #c084fc 100%);
      bottom: -100px;
      left: -100px;
    }

    /* Sticky Navbar */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1.5px solid #eef2f6;
      padding: 0.85rem 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 3.5rem;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #0b63e5 0%, #8b5cf6 55%, #ec4899 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.25rem;
      box-shadow: 0 4px 16px rgba(139, 92, 246, 0.35);
      flex-shrink: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .brand-logo:hover .brand-icon {
      transform: rotate(-6deg) scale(1.06);
      box-shadow: 0 6px 22px rgba(236, 72, 153, 0.45);
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 800;
      background: linear-gradient(135deg, #0b63e5 0%, #7c3aed 55%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav-links li {
      display: inline-flex;
      align-items: center;
    }

    .nav-links a {
      text-decoration: none;
      color: #374151;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 8px 20px;
      border-radius: 9999px;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .nav-links a:hover {
      color: #7c3aed;
      background: linear-gradient(135deg, rgba(11, 99, 229, 0.05), rgba(236, 72, 153, 0.08));
    }

    .nav-links a.nav-item-active {
      background: linear-gradient(135deg, #0b63e5 0%, #8b5cf6 55%, #ec4899 100%) !important;
      color: #ffffff !important;
      padding: 8px 20px;
      box-shadow: 0 4px 16px rgba(139, 92, 246, 0.38);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn-nav-outline {
      padding: 0.55rem 1.25rem;
      border-radius: 9999px;
      border: 1.5px solid #cbd5e1;
      background: white;
      color: #334155;
      font-weight: 700;
      font-size: 0.88rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-nav-outline:hover {
      background: #f8fafc;
      border-color: var(--primary-color);
      color: var(--primary-color);
    }

    .user-capsule {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 4px 16px 4px 5px;
      background: white;
      border: 1.5px solid #e2e8f0;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    }

    .user-capsule:hover {
      border-color: var(--primary-color);
      box-shadow: 0 4px 12px rgba(11, 99, 229, 0.12);
    }

    .user-capsule-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--primary-color);
      background: #e2e8f0;
    }

    .user-capsule-name {
      font-size: 0.92rem;
      font-weight: 700;
      color: #0f172a;
      white-space: nowrap;
    }

    .btn-logout {
      background: #fef2f2;
      border: 1.5px solid #fecaca;
      color: #dc2626;
      border-radius: 9999px;
      padding: 7px 16px;
      font-weight: 700;
      font-size: 0.85rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-logout:hover {
      background: #fee2e2;
    }

    .container {
      max-width: 1200px;
      margin: 2.5rem auto;
      padding: 0 5%;
      position: relative;
      z-index: 1;
    }

    .page-h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 2rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cart-badge-count {
      font-size: 0.95rem;
      background: rgba(11, 99, 229, 0.1);
      color: var(--primary-color);
      padding: 4px 14px;
      border-radius: 9999px;
      font-weight: 700;
    }

    .cart-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 2rem;
    }

    .cart-item {
      background: white;
      border-radius: 24px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.2rem;
      display: flex;
      gap: 1.5rem;
      align-items: center;
      border: 1.5px solid #f1f5f9;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.03);
      transition: all 0.25s ease;
    }

    .cart-item:hover {
      border-color: rgba(139, 92, 246, 0.4);
      transform: translateY(-2px);
    }

    .cart-thumb-box {
      width: 130px;
      height: 80px;
      border-radius: 14px;
      overflow: hidden;
      flex-shrink: 0;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      position: relative;
    }

    .cart-thumb-box svg {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .cart-thumb-box img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .cart-info {
      flex: 1;
    }

    .cart-title {
      font-weight: 800;
      font-size: 1.05rem;
      margin-bottom: 0.35rem;
      color: var(--text-main);
      line-height: 1.4;
    }

    .cart-price {
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--primary-color);
      white-space: nowrap;
    }

    .summary-card {
      background: white;
      border-radius: 28px;
      padding: 2rem;
      border: 1.5px solid #f1f5f9;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      height: fit-content;
    }

    .summary-h2 {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
      color: var(--text-main);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-weight: 600;
      color: var(--text-sub);
    }

    .summary-total {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-main);
      border-top: 1.5px solid #e2e8f0;
      padding-top: 1.2rem;
      margin-top: 1.2rem;
    }

    .voucher-wrap {
      display: flex;
      gap: 8px;
      margin: 1.5rem 0;
    }

    .voucher-input {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 9999px;
      border: 1.5px solid #cbd5e1;
      outline: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: border-color 0.2s;
    }

    .voucher-input:focus {
      border-color: var(--primary-color);
    }

    .btn-apply {
      padding: 0.75rem 1.3rem;
      border-radius: 9999px;
      border: none;
      background: #1e293b;
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .btn-apply:hover {
      background: #0f172a;
    }

    .btn-checkout {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 1.05rem;
      border-radius: 9999px;
      border: none;
      background: var(--primary-grad);
      color: white;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(11, 99, 229, 0.3);
      font-size: 1.02rem;
      transition: all 0.25s ease;
    }

    .btn-checkout:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 35px rgba(139, 92, 246, 0.45);
    }

    @media (max-width: 900px) {
      .cart-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>

  <header>
    <div class="header-left">
      <a href="../index.html" class="brand-logo">
        <div class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></div>
        <span class="brand-title">LHD – Learning</span>
      </a>

      <!-- Desktop Navigation Menu (Đồng bộ vị trí với index.html) -->
      <ul class="nav-links">
        <li><a href="../index.html">Trang chủ</a></li>
        <li><a href="../courses.html">Khóa học</a></li>
      </ul>
    </div>

    <div class="header-right">
      <a href="../courses.html" class="btn-nav-outline">
        <i class="fa-solid fa-compass"></i>
        <span>Tiếp tục chọn khóa học</span>
      </a>

      <a href="profile.html" class="user-capsule" title="Xem trang thông tin cá nhân học viên">
        <img
          src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' width='64' height='64' shape-rendering='crispEdges'><rect width='64' height='64' fill='%23a4c68d'/><rect x='0' y='0' width='64' height='28' fill='%237ba36a'/><rect x='6' y='8' width='12' height='14' fill='%23507c43'/><rect x='46' y='10' width='14' height='12' fill='%23507c43'/><rect x='22' y='4' width='20' height='8' fill='%23669152'/><rect x='0' y='32' width='64' height='32' fill='%23c4936d'/><rect x='0' y='42' width='64' height='22' fill='%23b17c54'/><rect x='20' y='12' width='24' height='16' fill='%231e1e24'/><rect x='22' y='16' width='20' height='20' fill='%23fddbc3'/><rect x='24' y='34' width='16' height='4' fill='%23fbc5a3'/><rect x='18' y='10' width='28' height='8' fill='%2322242a'/><rect x='18' y='18' width='6' height='8' fill='%2322242a'/><rect x='40' y='18' width='6' height='8' fill='%2322242a'/><rect x='24' y='14' width='8' height='6' fill='%2330323a'/><rect x='34' y='14' width='8' height='5' fill='%2322242a'/><rect x='18' y='24' width='4' height='6' fill='%23fbc5a3'/><rect x='42' y='24' width='4' height='6' fill='%23fbc5a3'/><rect x='25' y='25' width='4' height='4' fill='%231e1e24'/><rect x='35' y='25' width='4' height='4' fill='%231e1e24'/><rect x='23' y='28' width='4' height='2' fill='%23f7a799'/><rect x='37' y='28' width='4' height='2' fill='%23f7a799'/><rect x='29' y='31' width='6' height='2' fill='%23d97d64'/><rect x='22' y='21' width='10' height='9' fill='none' stroke='%23111' stroke-width='2'/><rect x='32' y='21' width='10' height='9' fill='none' stroke='%23111' stroke-width='2'/><rect x='31' y='24' width='2' height='2' fill='%23111'/><rect x='24' y='22' width='2' height='2' fill='%23ffffff'/><rect x='34' y='22' width='2' height='2' fill='%23ffffff'/><rect x='16' y='38' width='32' height='26' fill='%232b2d35'/><rect x='28' y='38' width='8' height='8' fill='%23b91c1c'/><rect x='22' y='38' width='6' height='26' fill='%233a3d47'/><rect x='36' y='38' width='6' height='26' fill='%233a3d47'/><rect x='29' y='44' width='6' height='20' fill='%23dc2626'/><rect x='31' y='42' width='2' height='22' fill='%23991b1b'/></svg>"
          class="user-capsule-avatar" alt="Học Viên">
        <span class="user-capsule-name">Học Viên</span>
      </a>

      <button type="button" class="btn-logout" id="btnLogoutUser">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Đăng xuất</span>
      </button>
    </div>
  </header>

  <main class="container">
    <h1 class="page-h1">
      <i class="fa-solid fa-cart-shopping" style="color: var(--primary-color);"></i>
      Giỏ Hàng Của Bạn
      <span class="cart-badge-count" id="cartHeaderBadge">0 Khóa học</span>
    </h1>

    <div class="cart-grid">
      <div id="cartItemsList">
        <!-- Dynamic list rendered by JavaScript -->
      </div>

      <div class="summary-card">
        <h2 class="summary-h2">Tóm Tắt Đơn Hàng</h2>
        <div class="summary-row"><span>Tạm tính</span> <span id="summarySubtotal">0đ</span></div>
        <div class="summary-row"><span>Giảm giá Voucher</span> <span id="summaryDiscount"
            style="color: #059669; font-weight: 700;">0đ</span></div>

        <div class="voucher-wrap">
          <input type="text" value="" placeholder="Nhập mã giảm giá (VD: CHAOMUNG2026)" class="voucher-input"
            id="voucherInput">
          <button type="button" class="btn-apply" onclick="applyVoucher()">Áp dụng</button>
        </div>

        <div class="summary-row summary-total">
          <span>Tổng thanh toán</span>
          <span id="summaryTotal" style="color: var(--primary-color); font-size: 1.4rem;">0đ</span>
        </div>

        <a href="checkout.html" class="btn-checkout" id="btnProceedCheckout" style="margin-top: 1.5rem;">
          <i class="fa-solid fa-shield-check"></i>
          <span>TIẾN HÀNH THANH TOÁN VNPAY</span>
        </a>
      </div>
    </div>
  </main>

  <script>
    let user = null;
    try {
      user = JSON.parse(localStorage.getItem('user_info') || sessionStorage.getItem('current_user') || 'null');
    } catch (e) { user = null; }

    if (!user) {
      window.location.replace('../auth/login.html');
    }

    if (user) {
      if (user.email) {
        const regUsers = JSON.parse(localStorage.getItem('lhd_registered_users') || '[]');
        const foundReg = regUsers.find(r => r.email.toLowerCase() === user.email.toLowerCase());
        if (foundReg && foundReg.name) {
          user.name = foundReg.name;
        }
      }
      const displayName = user.name || (user.email ? user.email.split('@')[0] : 'Học Viên');
      document.querySelectorAll('.user-capsule-name, .user-pill-name').forEach(el => el.textContent = displayName);
      const savedAvatar = localStorage.getItem('lhd_user_avatar');
      if (savedAvatar) {
        document.querySelectorAll('.user-capsule-avatar, .user-pill-avatar').forEach(img => img.src = savedAvatar);
      }
    }

    let appliedVoucher = null;

    const VOUCHERS = {
      'CHAOMUNG2026': { discount: 200000, type: 'fixed', label: 'CHAOMUNG2026' },
      'LHDVIP': { discount: 500000, type: 'fixed', label: 'LHDVIP' },
      'GIAM100K': { discount: 100000, type: 'fixed', label: 'GIAM100K' },
      'GIAM50K': { discount: 50000, type: 'fixed', label: 'GIAM50K' },
      'GIAM10PT': { discount: 0.1, type: 'percent', label: 'GIAM10PT' },
      'HOCVIENMOI': { discount: 150000, type: 'fixed', label: 'HOCVIENMOI' }
    };

    function formatMoney(amount) {
      return (amount || 0).toLocaleString('vi-VN') + 'đ';
    }

    function getCartData() {
      try {
        return JSON.parse(localStorage.getItem('lhd_cart') || '[]');
      } catch (e) { return []; }
    }

    function saveCartData(cart) {
      localStorage.setItem('lhd_cart', JSON.stringify(cart));
      renderCart();
    }

    function removeCartItem(index) {
      let cart = getCartData();
      if (index >= 0 && index < cart.length) {
        cart.splice(index, 1);
        saveCartData(cart);
      }
    }

    function applyVoucher() {
      const input = document.getElementById('voucherInput');
      const code = (input.value || '').trim().toUpperCase();

      if (!code) {
        appliedVoucher = null;
        alert('Vui lòng nhập mã giảm giá.');
        renderCart();
        return;
      }

      if (VOUCHERS[code]) {
        appliedVoucher = { code, ...VOUCHERS[code] };
        let discMsg = appliedVoucher.type === 'percent' ? (appliedVoucher.discount * 100 + '%') : formatMoney(appliedVoucher.discount);
        alert(`Áp dụng mã giảm giá ${code} thành công! Được giảm ${discMsg}.`);
      } else {
        appliedVoucher = null;
        alert('Mã giảm giá không hợp lệ hoặc đã hết hạn.');
      }
      renderCart();
    }

    function renderCart() {
      const cart = getCartData();
      const listElem = document.getElementById('cartItemsList');
      const badgeElem = document.getElementById('cartHeaderBadge');
      const subtotalElem = document.getElementById('summarySubtotal');
      const discountElem = document.getElementById('summaryDiscount');
      const totalElem = document.getElementById('summaryTotal');
      const btnCheckout = document.getElementById('btnProceedCheckout');

      badgeElem.textContent = cart.length + ' Khóa học';

      if (cart.length === 0) {
        listElem.innerHTML = `
          <div style="text-align: center; padding: 3rem 1.5rem; background: white; border-radius: 24px; border: 1.5px solid #f1f5f9; box-shadow: 0 8px 25px rgba(0,0,0,0.03);">
            <i class="fa-solid fa-cart-shopping" style="font-size: 3.5rem; color: #cbd5e1; margin-bottom: 1rem;"></i>
            <h3 style="font-size: 1.25rem; font-weight: 800; color: #1e293b; margin-bottom: 0.5rem;">Giỏ hàng của bạn đang trống</h3>
            <p style="color: #64748b; font-size: 0.92rem; margin-bottom: 1.5rem;">Bạn chưa thêm khóa học nào vào giỏ hàng. Hãy khám phá ngay các khóa học chất lượng của LHD!</p>
            <a href="../courses.html" class="btn-checkout" style="display: inline-flex; width: auto; padding: 0.8rem 2rem;">
              <i class="fa-solid fa-compass"></i>
              <span>Khám phá khóa học ngay</span>
            </a>
          </div>
        `;
        subtotalElem.textContent = '0đ';
        discountElem.textContent = '0đ';
        totalElem.textContent = '0đ';
        if (btnCheckout) {
          btnCheckout.style.opacity = '0.5';
          btnCheckout.style.pointerEvents = 'none';
        }
        return;
      }

      if (btnCheckout) {
        btnCheckout.style.opacity = '1';
        btnCheckout.style.pointerEvents = 'auto';
      }

      let subtotal = 0;
      let html = '';

      cart.forEach((item, idx) => {
        let priceNum = item.priceVal || parseInt((item.price || '0').replace(/[^0-9]/g, '')) || 1850000;
        subtotal += priceNum;

        let thumbMarkup = '';
        if (item.thumbSvg) {
          thumbMarkup = `<div class="cart-thumb-box">${item.thumbSvg}</div>`;
        } else if (item.thumb && item.thumb.startsWith('data:image/svg+xml')) {
          thumbMarkup = `<div class="cart-thumb-box"><img src="${item.thumb}" alt="${item.title}"></div>`;
        } else if (item.thumb) {
          thumbMarkup = `<div class="cart-thumb-box"><img src="${item.thumb}" alt="${item.title}"></div>`;
        } else {
          thumbMarkup = `<div class="cart-thumb-box"><img src="https://images.unsplash.com/photo-1546410531-bb4caa6b424d?w=300" alt="${item.title}"></div>`;
        }

        html += `
          <div class="cart-item">
            ${thumbMarkup}
            <div class="cart-info">
              <div class="cart-title">${item.title}</div>
              <div style="font-size: 0.85rem; color: #64748b;"><i class="fa-solid fa-chalkboard-user"></i> Giảng viên: ${item.instructor || 'Giảng viên LHD – Learning'}</div>
            </div>
            <div class="cart-price">${item.price || formatMoney(priceNum)}</div>
            <i class="fa-solid fa-trash-can" style="color: #94a3b8; cursor: pointer; margin-left: 1rem; font-size: 1.15rem; transition: color 0.2s;" title="Xóa khóa học khỏi giỏ hàng" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='#94a3b8'" onclick="removeCartItem(${idx})"></i>
          </div>
        `;
      });

      listElem.innerHTML = html;

      let discount = 0;
      if (appliedVoucher) {
        if (appliedVoucher.type === 'percent') {
          discount = Math.round(subtotal * appliedVoucher.discount);
        } else {
          discount = appliedVoucher.discount;
        }
      }
      if (discount > subtotal) discount = subtotal;

      let finalTotal = Math.max(0, subtotal - discount);

      subtotalElem.textContent = formatMoney(subtotal);
      discountElem.textContent = discount > 0 ? ('-' + formatMoney(discount)) : '0đ';
      totalElem.textContent = formatMoney(finalTotal);
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderCart();
    });

    const btnLogoutUser = document.getElementById('btnLogoutUser');
    if (btnLogoutUser) {
      btnLogoutUser.addEventListener('click', () => {
        localStorage.removeItem('auth_token');
        localStorage.removeItem('user_info');
        localStorage.removeItem('lhd_learning_logged_in');
        sessionStorage.clear();
        window.location.href = '../auth/login.html';
      });
    }
  </script>
</body>

</html>
