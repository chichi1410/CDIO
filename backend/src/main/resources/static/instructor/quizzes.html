<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ngân Hàng Câu Hỏi & Quiz | Kênh Giảng Viên</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root { --primary: #9333ea; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: #f8fafc; color: #0f172a; min-height: 100vh; }

    header { background: white; border-bottom: 1.5px solid #f1f5f9; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; }
    .container { max-width: 1100px; margin: 2.5rem auto; padding: 0 5%; }

    .card-box { background: white; border-radius: 28px; padding: 2rem; border: 1.5px solid #f1f5f9; box-shadow: 0 10px 25px rgba(0,0,0,0.03); margin-bottom: 2rem; }

    .q-item { background: #f8fafc; border-radius: 18px; padding: 1.25rem; margin-bottom: 1rem; border: 1px solid #e2e8f0; }
    .btn-add { padding: 0.75rem 1.5rem; border-radius: 9999px; background: #9333ea; color: white; border: none; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <a href="dashboard.html" style="font-weight: 800; text-decoration: none; color: #9333ea;"> Quay lại Dashboard Giảng Viên</a>
    <span style="font-weight: 800;">Ngân Hàng Câu Hỏi Trắc Nghiệm</span>
  </header>

  <div class="container">
    <div class="card-box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h2 style="font-size: 1.3rem; font-weight: 800;">Danh Sách Câu Hỏi Quiz Trắc Nghiệm</h2>
        <button class="btn-add"><i class="fa-solid fa-plus"></i> Thêm Câu Hỏi Mới</button>
      </div>

      <div class="q-item">
        <p style="font-weight: 700; margin-bottom: 0.5rem;">Câu 1: Chọn từ đúng điền vào chỗ trống: "She ___ to school every day."</p>
        <div style="font-size: 0.9rem; color: #475569;">
          <div>A. go</div>
          <div style="color: #16a34a; font-weight: 700;">✓ B. goes (Đáp án đúng)</div>
          <div>C. going</div>
          <div>D. gone</div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
